[workspace]
members = ["native-note-core", "native-note-server", "native-note-testkit"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
native-note-core = { path = "native-note-core", version = "=0.1.0" }
native-note-testkit = { path = "native-note-testkit", version = "=0.1.0" }
ring = { version = "=0.17.14", default-features = false }

[workspace.lints.clippy]
disallowed_macros = "allow"
disallowed_methods = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package.libsqlite3-sys]
opt-level = 3
