disallowed-methods = [
	{ path = "slice::split_at", reason = "panics out of bounds; use split_at_checked" },
	{ path = "slice::split_at_mut", reason = "panics out of bounds; use split_at_mut_checked" },
	{ path = "slice::copy_from_slice", reason = "panics on a length mismatch" },
	{ path = "slice::clone_from_slice", reason = "panics on a length mismatch" },
	{ path = "slice::swap", reason = "panics out of bounds" },
	{ path = "usize::next_power_of_two", reason = "overflows; use checked_next_power_of_two" },
	{ path = "usize::pow", reason = "overflows; use checked_pow" },
	{ path = "u32::pow", reason = "overflows; use checked_pow" },
	{ path = "u64::pow", reason = "overflows; use checked_pow" },
	{ path = "core::iter::Iterator::sum", reason = "overflows; fold with checked or saturating arithmetic" },
	{ path = "core::iter::Iterator::product", reason = "overflows; fold with checked or saturating arithmetic" },
	{ path = "alloc::vec::Vec::with_capacity", reason = "never allocate from a length" },
	{ path = "alloc::vec::Vec::reserve", reason = "never allocate from a length" },
	{ path = "alloc::vec::Vec::reserve_exact", reason = "never allocate from a length" },
	{ path = "alloc::vec::Vec::insert", reason = "panics out of bounds" },
	{ path = "alloc::vec::Vec::remove", reason = "panics out of bounds" },
	{ path = "alloc::vec::Vec::swap_remove", reason = "panics out of bounds" },
	{ path = "alloc::vec::Vec::drain", reason = "panics out of bounds" },
	{ path = "alloc::vec::Vec::split_off", reason = "panics out of bounds" },
	{ path = "alloc::vec::Vec::splice", reason = "panics out of bounds" },
]
disallowed-macros = [
	{ path = "core::assert", reason = "panics; return an error" },
	{ path = "core::assert_eq", reason = "panics; return an error" },
	{ path = "core::assert_ne", reason = "panics; return an error" },
	{ path = "core::debug_assert", reason = "panics; return an error" },
	{ path = "core::debug_assert_eq", reason = "panics; return an error" },
	{ path = "core::debug_assert_ne", reason = "panics; return an error" },
	{ path = "alloc::vec", reason = "never allocate from a length" },
]
