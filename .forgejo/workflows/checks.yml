name: checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: native-note-checks-${{ forgejo.event.pull_request.number || forgejo.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ["fork", "debian", "4c8g", "hetzner"]
    timeout-minutes: 30
    defaults:
      run:
        shell: >-
          /usr/bin/env
          -u GITHUB_TOKEN -u FORGEJO_TOKEN
          -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          -u ACTIONS_CACHE_URL -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL
          bash --noprofile --norc -e -o pipefail {0}
    env:
      PR_NUMBER: ${{ forgejo.event.pull_request.number }}
      PR_HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
      WORKSPACE: /opt/native-note-ci
      CARGO_HOME: /opt/rust/cargo
      RUSTUP_HOME: /opt/rust/rustup
      CARGO_TERM_COLOR: never
      CARGO_TERM_PROGRESS_WHEN: never
    steps:
      - name: Verify CI environment
        run: |
          leaked=$(env | grep -iE '(TOKEN|SECRET|PASSWORD|CREDENTIAL|KEY)=.' || true)
          [ -z "$leaked" ] || { echo "FATAL: privileged credential reachable by PR code:"; echo "$leaked" | sed 's/=.*/=<redacted>/'; exit 1; }

      - name: Check out
        run: |
          : "${WORKSPACE:?}"
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"

          if [ -n "$PR_NUMBER" ]; then
            ref="refs/pull/${PR_NUMBER}/head"
            want="$PR_HEAD_SHA"
          else
            ref="$FORGEJO_REF"
            want="$FORGEJO_SHA"
          fi

          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch -q --depth 1 origin "$ref"
          git checkout -q FETCH_HEAD
          [ -z "$want" ] || [ "$(git rev-parse HEAD)" = "$want" ] \
            || { echo "FATAL: head moved since the run was queued (want $want, got $(git rev-parse HEAD))"; exit 1; }

      - name: Install the pinned toolchain
        run: cd "$WORKSPACE" && ./.forgejo/scripts/install-rust-toolchain.sh

      - name: Repository hygiene
        run: |
          cd "$WORKSPACE"
          tracked="$(git ls-files)"
          if grep -E '(^|/)\.env($|\.)|(^|/)\.DS_Store$|(^|/)target/|\.(pem|key|p12|mobileprovision|jks|keystore)$' <<<"$tracked"; then
            echo "FATAL: forbidden files are tracked"
            exit 1
          fi

      - name: Documentation links resolve
        run: cd "$WORKSPACE" && ./.forgejo/scripts/check-docs-links.sh

      - name: Formatting
        run: |
          cd "$WORKSPACE"
          for project in spec/generator server; do
            [ -f "$project/Cargo.toml" ] || continue
            ( cd "$project" && cargo fmt --check )
          done
          rustfmt --check --edition 2024 server/native-note-core/fuzz/fuzz_targets/*.rs

      - name: Clippy
        run: |
          cd "$WORKSPACE"
          for project in spec/generator server server/native-note-core/fuzz; do
            [ -f "$project/Cargo.toml" ] || continue
            ( cd "$project" && cargo clippy --all-targets --locked -- -D warnings )
          done

      - name: Fuzz targets build
        run: cd "$WORKSPACE/server/native-note-core/fuzz" && cargo build --locked

      - name: Tests
        run: |
          cd "$WORKSPACE"
          for project in spec/generator server; do
            [ -f "$project/Cargo.toml" ] || continue
            ( cd "$project" && cargo test --locked )
          done

      - name: Generator line coverage
        run: cd "$WORKSPACE" && ./.forgejo/scripts/rust-coverage.sh

      - name: Server coverage
        run: cd "$WORKSPACE" && ./.forgejo/scripts/server-coverage.sh

      - name: Vectors match the generator
        run: |
          cd "$WORKSPACE/spec/generator"
          cargo run --locked --bin gen-vectors
          cd "$WORKSPACE"
          stale="$(git status --porcelain -- spec/vectors)"
          test -z "$stale" \
            || { echo "FATAL: spec/vectors is stale — regenerate it in the same commit as the spec change"; exit 1; }

  cross:
    runs-on: ["fork", "debian", "4c8g", "hetzner"]
    timeout-minutes: 40
    defaults:
      run:
        shell: >-
          /usr/bin/env
          -u GITHUB_TOKEN -u FORGEJO_TOKEN
          -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          -u ACTIONS_CACHE_URL -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL
          bash --noprofile --norc -e -o pipefail {0}
    env:
      PR_NUMBER: ${{ forgejo.event.pull_request.number }}
      PR_HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
      WORKSPACE: /opt/native-note-cross
      CARGO_HOME: /opt/rust/cargo
      RUSTUP_HOME: /opt/rust/rustup
      CARGO_TERM_COLOR: never
      CARGO_TERM_PROGRESS_WHEN: never
    steps:
      - name: Verify CI environment
        run: |
          leaked=$(env | grep -iE '(TOKEN|SECRET|PASSWORD|CREDENTIAL|KEY)=.' || true)
          [ -z "$leaked" ] || { echo "FATAL: privileged credential reachable by PR code:"; echo "$leaked" | sed 's/=.*/=<redacted>/'; exit 1; }

      - name: Check out
        run: |
          : "${WORKSPACE:?}"
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"

          if [ -n "$PR_NUMBER" ]; then
            ref="refs/pull/${PR_NUMBER}/head"
            want="$PR_HEAD_SHA"
          else
            ref="$FORGEJO_REF"
            want="$FORGEJO_SHA"
          fi

          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch -q --depth 1 origin "$ref"
          git checkout -q FETCH_HEAD
          [ -z "$want" ] || [ "$(git rev-parse HEAD)" = "$want" ] \
            || { echo "FATAL: head moved since the run was queued (want $want, got $(git rev-parse HEAD))"; exit 1; }

      - name: Install the pinned toolchain
        run: cd "$WORKSPACE" && ./.forgejo/scripts/install-rust-toolchain.sh

      - name: Install qemu
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y --no-install-recommends qemu-user-static binfmt-support xz-utils

      - name: Server tests on arm64 and armv7
        run: cd "$WORKSPACE" && ./.forgejo/scripts/server-cross-test.sh aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf

  armv6:
    runs-on: ["fork", "debian", "4c8g", "hetzner"]
    timeout-minutes: 40
    defaults:
      run:
        shell: >-
          /usr/bin/env
          -u GITHUB_TOKEN -u FORGEJO_TOKEN
          -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          -u ACTIONS_CACHE_URL -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL
          bash --noprofile --norc -e -o pipefail {0}
    env:
      PR_NUMBER: ${{ forgejo.event.pull_request.number }}
      PR_HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
      WORKSPACE: /opt/native-note-armv6
      CARGO_HOME: /opt/rust/cargo
      RUSTUP_HOME: /opt/rust/rustup
      CARGO_TERM_COLOR: never
      CARGO_TERM_PROGRESS_WHEN: never
    steps:
      - name: Verify CI environment
        run: |
          leaked=$(env | grep -iE '(TOKEN|SECRET|PASSWORD|CREDENTIAL|KEY)=.' || true)
          [ -z "$leaked" ] || { echo "FATAL: privileged credential reachable by PR code:"; echo "$leaked" | sed 's/=.*/=<redacted>/'; exit 1; }

      - name: Check out
        run: |
          : "${WORKSPACE:?}"
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"

          if [ -n "$PR_NUMBER" ]; then
            ref="refs/pull/${PR_NUMBER}/head"
            want="$PR_HEAD_SHA"
          else
            ref="$FORGEJO_REF"
            want="$FORGEJO_SHA"
          fi

          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch -q --depth 1 origin "$ref"
          git checkout -q FETCH_HEAD
          [ -z "$want" ] || [ "$(git rev-parse HEAD)" = "$want" ] \
            || { echo "FATAL: head moved since the run was queued (want $want, got $(git rev-parse HEAD))"; exit 1; }

      - name: Install the pinned toolchain
        run: cd "$WORKSPACE" && ./.forgejo/scripts/install-rust-toolchain.sh

      - name: Install qemu
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y --no-install-recommends qemu-user-static binfmt-support xz-utils

      - name: Server tests on ARMv6, as a Raspberry Pi 1 runs them
        run: cd "$WORKSPACE" && QEMU_CPU=arm1176 ./.forgejo/scripts/server-cross-test.sh arm-unknown-linux-musleabihf

  android:
    runs-on: ["fork", "debian", "4c8g", "hetzner"]
    timeout-minutes: 40
    defaults:
      run:
        shell: >-
          /usr/bin/env
          -u GITHUB_TOKEN -u FORGEJO_TOKEN
          -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          -u ACTIONS_CACHE_URL -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL
          bash --noprofile --norc -e -o pipefail {0}
    env:
      PR_NUMBER: ${{ forgejo.event.pull_request.number }}
      PR_HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
      WORKSPACE: /opt/native-note-android
      ANDROID_HOME: /opt/android-sdk
      GRADLE_USER_HOME: /opt/gradle
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
    steps:
      - name: Verify CI environment
        run: |
          leaked=$(env | grep -iE '(TOKEN|SECRET|PASSWORD|CREDENTIAL|KEY)=.' || true)
          [ -z "$leaked" ] || { echo "FATAL: privileged credential reachable by PR code:"; echo "$leaked" | sed 's/=.*/=<redacted>/'; exit 1; }

      - name: Check out
        run: |
          : "${WORKSPACE:?}"
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"

          if [ -n "$PR_NUMBER" ]; then
            ref="refs/pull/${PR_NUMBER}/head"
            want="$PR_HEAD_SHA"
          else
            ref="$FORGEJO_REF"
            want="$FORGEJO_SHA"
          fi

          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch -q --depth 1 origin "$ref"
          git checkout -q FETCH_HEAD
          [ -z "$want" ] || [ "$(git rev-parse HEAD)" = "$want" ] \
            || { echo "FATAL: head moved since the run was queued (want $want, got $(git rev-parse HEAD))"; exit 1; }

      - name: Check out the native submodules
        run: cd "$WORKSPACE" && git submodule update --init --depth 1 clients/android/argon2 clients/android/libtomcrypt clients/macos/native-note-kit/sqlcipher

      - name: Install the pinned SDK
        run: cd "$WORKSPACE" && ./.forgejo/scripts/install-android-sdk.sh "$ANDROID_HOME"

      - name: Gradle wrapper is Gradle's own
        run: |
          cd "$WORKSPACE/clients/android"
          echo "621008afc4f5d59357fcf06ffa644dd5aade5e091bdc363742710445f73cdaf8  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Lint and unit tests
        run: cd "$WORKSPACE/clients/android" && ./gradlew --no-daemon --console=plain lint testDebugUnitTest

      - name: Unsigned release build and its SHA-256
        run: cd "$WORKSPACE" && ./.forgejo/scripts/android-build.sh
