name: audit

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: native-note-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ["check", "hetzner"]
    timeout-minutes: 30
    defaults:
      run:
        shell: >-
          /usr/bin/env
          -u GITHUB_TOKEN -u FORGEJO_TOKEN
          -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          -u ACTIONS_CACHE_URL -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL
          bash --noprofile --norc -e -o pipefail {0}
    env:
      WORKSPACE: /opt/native-note-audit
      CARGO_HOME: /opt/rust/cargo
      RUSTUP_HOME: /opt/rust/rustup
      CARGO_TERM_COLOR: never
      CARGO_TERM_PROGRESS_WHEN: never
      RUSTUP_VERSION: "1.29.0"
      RUSTUP_SHA256: "4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10"
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_AUDIT_VERSION: "0.22.2"
    steps:
      - name: Verify CI environment
        run: |
          leaked=$(env | grep -iE '(TOKEN|SECRET|PASSWORD|CREDENTIAL|KEY)=.' || true)
          [ -z "$leaked" ] || { echo "FATAL: privileged credential reachable by CI code:"; echo "$leaked" | sed 's/=.*/=<redacted>/'; exit 1; }

      - name: Check out
        run: |
          : "${WORKSPACE:?}"
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"

          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch -q --depth 1 origin "$FORGEJO_REF"
          git checkout -q FETCH_HEAD

      - name: Install the pinned toolchain
        run: |
          command -v cc >/dev/null 2>&1 || {
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends gcc libc6-dev
          }

          curl -fsSLo /tmp/rustup-init \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_SHA256}  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain none
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

          cd "$WORKSPACE"
          "$CARGO_HOME/bin/rustup" show active-toolchain

      - name: Install the audit tools
        run: |
          cargo install --locked "cargo-deny@${CARGO_DENY_VERSION}"
          cargo install --locked "cargo-audit@${CARGO_AUDIT_VERSION}"

      - name: Licenses, bans, sources and advisories
        run: |
          cd "$WORKSPACE"
          for project in spec/generator server; do
            [ -f "$project/Cargo.toml" ] || continue
            echo "── $project ──"
            ( cd "$project" && cargo deny --config "$WORKSPACE/deny.toml" check )
          done

      - name: Advisories against the committed lockfiles
        run: |
          cd "$WORKSPACE"
          for project in spec/generator server; do
            [ -f "$project/Cargo.lock" ] || continue
            echo "── $project ──"
            ( cd "$project" && cargo audit --deny warnings )
          done
