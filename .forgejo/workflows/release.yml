name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: pushed tag to build
        type: string
        required: true

concurrency:
  group: native-note-release-${{ forgejo.event.inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ forgejo.event.inputs.tag }}
  WORKSPACE: /opt/native-note-release
  CARGO_HOME: /opt/rust/cargo
  RUSTUP_HOME: /opt/rust/rustup
  CARGO_TERM_COLOR: never
  CARGO_TERM_PROGRESS_WHEN: never

jobs:
  reproduce:
    runs-on: ["debian", "4c8g", "vultr"]
    timeout-minutes: 45
    outputs:
      sums: ${{ steps.build.outputs.sums }}
    defaults:
      run:
        shell: >-
          /usr/bin/env
          -u GITHUB_TOKEN -u FORGEJO_TOKEN
          -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          -u ACTIONS_CACHE_URL -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL
          bash --noprofile --norc -e -o pipefail {0}
    steps:
      - name: Verify CI environment
        run: |
          leaked=$(env | grep -iE '(TOKEN|SECRET|PASSWORD|CREDENTIAL|KEY)=.' || true)
          [ -z "$leaked" ] || { echo "FATAL: privileged credential reachable by build code:"; echo "$leaked" | sed 's/=.*/=<redacted>/'; exit 1; }

      - name: Check out the tag
        run: |
          : "${WORKSPACE:?}" "${RELEASE_TAG:?}"
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch -q --depth 1 origin "refs/tags/$RELEASE_TAG"
          git checkout -q FETCH_HEAD
          echo "building $RELEASE_TAG at $(git rev-parse HEAD)"

      - name: The tag names the project's versions
        run: |
          cd "$WORKSPACE"
          want="${RELEASE_TAG#v}"
          server="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' server/Cargo.toml)"
          macos="$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \(.*\);$/\1/p' clients/macos/native-note.xcodeproj/project.pbxproj | sort -u)"
          [ "$server" = "$want" ] || { echo "FATAL: server/Cargo.toml is at $server, not $want"; exit 1; }
          [ "$macos" = "$want" ] || { echo "FATAL: the Xcode project is at $macos, not $want"; exit 1; }

      - name: Install system packages
        run: |
          command -v xz >/dev/null 2>&1 || {
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends xz-utils
          }

      - name: Install the pinned toolchain
        run: cd "$WORKSPACE" && ./.forgejo/scripts/install-rust-toolchain.sh

      - name: Build
        id: build
        run: |
          cd "$WORKSPACE"
          ./.forgejo/scripts/server-release.sh
          sums="$(cd releases && sha256sum native-note-server-linux-* | LC_ALL=C sort -k 2 | paste -sd ';' -)"
          echo "sums=$sums" >> "$GITHUB_OUTPUT"

  build:
    needs: reproduce
    runs-on: ["debian", "4c8g", "hetzner"]
    timeout-minutes: 45
    defaults:
      run:
        shell: >-
          /usr/bin/env
          -u GITHUB_TOKEN -u FORGEJO_TOKEN
          -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          -u ACTIONS_CACHE_URL -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL
          bash --noprofile --norc -e -o pipefail {0}
    steps:
      - name: Verify CI environment
        run: |
          leaked=$(env | grep -iE '(TOKEN|SECRET|PASSWORD|CREDENTIAL|KEY)=.' || true)
          [ -z "$leaked" ] || { echo "FATAL: privileged credential reachable by build code:"; echo "$leaked" | sed 's/=.*/=<redacted>/'; exit 1; }

      - name: Check out the tag
        run: |
          : "${WORKSPACE:?}" "${RELEASE_TAG:?}"
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch -q --depth 1 origin "refs/tags/$RELEASE_TAG"
          git checkout -q FETCH_HEAD
          echo "building $RELEASE_TAG at $(git rev-parse HEAD)"

      - name: Install system packages
        run: |
          missing=()
          command -v xz >/dev/null 2>&1 || missing+=(xz-utils)
          command -v node >/dev/null 2>&1 || missing+=(nodejs)
          if [ ${#missing[@]} -gt 0 ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Install the pinned toolchain
        run: cd "$WORKSPACE" && ./.forgejo/scripts/install-rust-toolchain.sh

      - name: Build
        run: cd "$WORKSPACE" && ./.forgejo/scripts/server-release.sh

      - name: Match the other provider's build
        env:
          REPRODUCED: ${{ needs.reproduce.outputs.sums }}
        run: |
          cd "$WORKSPACE/releases"
          sums="$(sha256sum native-note-server-linux-* | LC_ALL=C sort -k 2 | paste -sd ';' -)"
          echo "hetzner: $sums"
          echo "vultr:   $REPRODUCED"
          [ -n "$REPRODUCED" ] && [ "$sums" = "$REPRODUCED" ] \
            || { echo "FATAL: the two providers built different binaries"; exit 1; }

      - name: Offer the binaries for download
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: native-note-server-${{ env.RELEASE_TAG }}
          path: ${{ env.WORKSPACE }}/releases/native-note-server-linux-*
          if-no-files-found: error
